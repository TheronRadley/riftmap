name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Zig engine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        shell: bash
        run: bash scripts/setup-zig.sh

      - name: Build engine (ReleaseSafe)
        shell: bash
        run: |
          set +e
          bash scripts/build-engine.sh 2>&1 | tee "$RUNNER_TEMP/engine-build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the tail of the compiler output as job annotations so the
            # failure is readable without downloading the run log archive.
            while IFS= read -r line; do
              echo "::error file=engine::$line"
            done < <(tail -n 30 "$RUNNER_TEMP/engine-build.log")
            exit "$code"
          fi

      - name: Engine unit tests
        shell: bash
        run: bash scripts/test-engine.sh

      - name: Engine CLI smoke test
        shell: bash
        run: |
          bash fixtures/scripts/make-fixtures.sh
          ./engine/zig-out/bin/riftmap-engine --pretty fixtures/generated/tiny-js

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Electron binary is not needed for builds or tests, and skipping it
      # keeps CI fast and hermetic.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install Zig 0.13.0
        run: bash scripts/setup-zig.sh

      - name: Build engine
        run: bash scripts/build-engine.sh

      - name: Generate fixtures
        run: bash fixtures/scripts/make-fixtures.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build renderer and Electron bundles
        working-directory: apps/desktop
        run: npm run build
